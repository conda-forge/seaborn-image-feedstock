{% set name = "seaborn-image" %}
{% set version = "0.11.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 525b5574ea19ea93aa742fe70e12697a82e9dbdf826856b214c6d19f655e6fba

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }},<3.15
    - matplotlib-base >=3.7
    - matplotlib-scalebar >=0.7.0,<0.9.0
    - numpy >=1.26
    - palettable >=3.3.0
    - pooch >=1.2.0
    - scikit-image >=0.17.2
    - scipy >=1.5.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - seaborn_image

about:
  home: https://github.com/SarthakJariwala/seaborn-image
  summary: Attractive, descriptive and effective image visualization with seaborn-like API built on top of matplotlib
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - SarthakJariwala
